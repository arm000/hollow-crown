<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>The Hollow Crown</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Georgia", serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        user-select: none;
        font-size: 14px;
        line-height: 1.4;
      }
      #hud .title {
        font-size: 20px;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
      }
      #hud .touch-hint {
        display: none;
      }
      #hud-message {
        margin-top: 6px;
        min-height: 1.4em;
        max-width: 60vw;
      }
      #hud-inventory {
        margin-top: 2px;
        font-size: 12px;
        opacity: 0.85;
      }
      #hud-party {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        user-select: none;
        font-size: 12px;
        line-height: 1.5;
        text-align: right;
        white-space: pre-line;
      }
      #win-screen {
        position: fixed;
        inset: 0;
        /* display: none by default (matches the `hidden` attribute in the
           HTML) so the screen doesn't show until Hud.showWinScreen() runs.
           An ID selector beats the browser's own `[hidden]` rule on
           specificity, so that default has to be spelled out here rather
           than left to `hidden` alone -- shown again via the :not([hidden])
           rule below once JS clears the attribute. */
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 4, 2, 0.85);
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        font-size: 32px;
        letter-spacing: 0.1em;
        z-index: 10;
      }
      #win-screen:not([hidden]) {
        display: flex;
      }
      #defeat-screen {
        position: fixed;
        inset: 0;
        display: none; /* see the #win-screen comment above for why this default has to be explicit */
        align-items: center;
        justify-content: center;
        background: rgba(20, 3, 3, 0.88);
        color: #d8b3a3;
        text-shadow: 0 1px 3px #000;
        font-size: 32px;
        letter-spacing: 0.1em;
        z-index: 10;
      }
      #defeat-screen:not([hidden]) {
        display: flex;
      }

      /* Combat overlay: mounted by CombatUI.ts. Same "spell out display:none
         explicitly" pattern as #win-screen above, learned from that bug --
         an ID selector would otherwise beat the browser's own [hidden] rule
         and leave this visible from page load. The background dims the
         corridor and, deliberately, blocks taps to whatever is underneath
         (the touch move-pad included) so combat fully replaces exploration
         input rather than layering confusingly on top of it. */
      #combat-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: rgba(5, 4, 2, 0.35);
        pointer-events: auto;
        z-index: 8;
      }
      #combat-ui:not([hidden]) {
        display: flex;
      }
      #combat-status {
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        font-size: 18px;
      }
      #combat-log {
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        background: rgba(5, 4, 2, 0.55);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-line;
        max-width: 480px;
        width: 90%;
        text-align: center;
      }
      #combat-actions {
        display: flex;
        gap: 12px;
      }
      #combat-actions[hidden] {
        display: none;
      }
      .combat-action-btn {
        font-size: 16px;
        padding: 10px 22px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.75);
        color: #d8c9a3;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .combat-action-btn:active {
        background: rgba(216, 201, 163, 0.35);
      }

      /* Touch controls: mounted by TouchControls.ts, hidden by default so
         mouse-driven desktops don't see buttons they don't need. Shown for
         any device whose primary pointer is coarse and has no hover (i.e.
         touch-primary), regardless of screen size. */
      #touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      @media (hover: none) and (pointer: coarse) {
        #touch-controls {
          display: block;
        }
        #hud .keyboard-hint {
          display: none;
        }
        #hud .touch-hint {
          display: block;
        }
      }
      .touch-pad {
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom));
        pointer-events: auto;
      }
      #move-pad {
        left: max(16px, env(safe-area-inset-left));
        width: 168px;
        height: 168px;
        display: grid;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(3, 54px);
        gap: 3px;
      }
      #turn-pad {
        right: max(16px, env(safe-area-inset-right));
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }
      .tp-btn {
        font-size: 22px;
        line-height: 1;
        color: #d8c9a3;
        background: rgba(20, 17, 13, 0.55);
        border: 1px solid rgba(216, 201, 163, 0.35);
        border-radius: 10px;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .tp-btn:active {
        background: rgba(216, 201, 163, 0.35);
      }
      .tp-up { grid-column: 2; grid-row: 1; }
      .tp-left { grid-column: 1; grid-row: 2; }
      .tp-right { grid-column: 3; grid-row: 2; }
      .tp-down { grid-column: 2; grid-row: 3; }
      .tp-interact { grid-column: 2; grid-row: 2; font-size: 12px; }
      #turn-pad .tp-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hud-party"></div>
    <div id="hud">
      <div class="title">THE HOLLOW CROWN</div>
      <div class="keyboard-hint">W/S: walk &nbsp; A/D: strafe &nbsp; Q/E or ←/→: turn &nbsp; Space: interact</div>
      <div class="touch-hint">Left pad: move &amp; interact &nbsp; right pad: turn</div>
      <div id="hud-message"></div>
      <div id="hud-inventory"></div>
    </div>
    <div id="win-screen" hidden>YOU ESCAPED</div>
    <div id="defeat-screen" hidden>THE PARTY HAS FALLEN</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
