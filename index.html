<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Hollow Crown</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Georgia", serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        pointer-events: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        user-select: none;
        font-size: 14px;
        line-height: 1.4;
      }
      #hud .title {
        font-size: 20px;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hud">
      <div class="title">THE HOLLOW CROWN</div>
      <div>W/S: walk &nbsp; A/D: strafe &nbsp; Q/E or ←/→: turn</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
