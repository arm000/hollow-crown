<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>The Hollow Crown</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Georgia", serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      /* The game renders at a small fixed internal resolution and this
         is what scales it up to fill the screen with blocky nearest-
         neighbor sampling instead of a smooth blur -- the core
         technique behind the whole "pixel art, whole-frame" look
         (docs/10-visual-style-guide.md#rendering-pipeline). Game.ts
         calls renderer.setSize(w, h, false) specifically so the
         canvas's own CSS size stays exactly this (100%/100%) instead
         of being reset to the low internal resolution in actual CSS
         pixels. */
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        pointer-events: none;
      }
      /* Self/party-targeted skill VFX placeholder (docs/14-asset-inventory.md,
         on a player request for spell-effect placeholders) -- driven
         every frame by Game.ts's ScreenFlash via Hud.ts's
         setScreenFlash, not CSS transitions/animations, since its
         fade-out needs to stay in lockstep with the same clock every
         other combat animation already runs on. Sits above the 3D
         canvas/crosshair but below every DOM overlay (menus, combat
         UI) so a flash never obscures anything the player actually
         needs to read. opacity starts at 0 -- Hud.ts always sets both
         together, but this is the honest default before the first
         frame ever runs. */
      #combat-flash {
        position: fixed;
        inset: 0;
        opacity: 0;
        background: #ffffff;
        pointer-events: none;
        z-index: 5;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        user-select: none;
        font-size: 14px;
        line-height: 1.4;
      }
      #hud .title {
        font-size: 20px;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
      }
      #hud-level {
        font-size: 11px;
        font-style: italic;
        opacity: 0.65;
        margin-bottom: 4px;
      }
      #hud .touch-hint {
        display: none;
      }
      #hud-message {
        margin-top: 6px;
        min-height: 1.4em;
        max-width: 60vw;
      }
      #hud-inventory {
        margin-top: 2px;
        font-size: 12px;
        opacity: 0.85;
      }
      #hud-party {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        user-select: none;
        font-size: 12px;
        line-height: 1.5;
        text-align: right;
        white-space: pre-line;
      }
      /* Minimap: mounted by MinimapUI.ts, a <canvas> drawn a handful of
         pixels per grid cell. image-rendering: pixelated keeps those
         cells crisp blocky squares at CSS-scaled-up size instead of a
         blurry upscale -- the same nearest-neighbor look
         docs/10-visual-style-guide.md wants for the eventual texture
         pass, cheaply true here already. Top-left, below the Inventory
         button: every other corner is already spoken for on a touch
         device (move pad bottom-left, turn pad bottom-right, party
         status top-right), but there's clear space under that one
         button on any reasonably tall screen. */
      #minimap {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        top: calc(max(12px, env(safe-area-inset-top)) + 44px);
        width: 120px;
        max-width: 32vw;
        height: auto;
        image-rendering: pixelated;
        border: 1px solid rgba(216, 201, 163, 0.4);
        border-radius: 4px;
        pointer-events: none;
        z-index: 2;
      }
      /* Always visible on both desktop and mobile -- unlike the touch
         move/turn pads (CSS-gated to coarse pointers only), this is the
         only way to reach the inventory screen on a device with no
         keyboard, so it can't be hidden behind a media query. */
      #inventory-toggle {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.65);
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
        z-index: 6;
      }
      /* Same always-visible reasoning as #inventory-toggle, immediately
         to its right -- muting has to be reachable without a keyboard
         too, and there's nowhere else uncrowded to put it (every other
         corner is already spoken for -- see the minimap's own
         comment). */
      #mute-toggle {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: calc(max(12px, env(safe-area-inset-left)) + 100px);
        font-size: 15px;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.65);
        color: #d8c9a3;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
        z-index: 6;
      }
      #mute-toggle:active {
        background: rgba(216, 201, 163, 0.35);
      }
      #inventory-toggle:active {
        background: rgba(216, 201, 163, 0.35);
      }
      /* Top-center, deliberately away from the crowded top-left corner
         (Inventory/Mute/Minimap) and top-right (party status) -- player
         report that Options/Level Up were only reachable by opening
         Inventory first (docs/08-roadmap-phases.md Phase 7): the fix
         that actually answers it is these three being reachable
         straight from exploration too, not just from one another once
         already in a menu (`MenuNav.ts` already covers that half).
         Always visible on both desktop and mobile, same reasoning as
         #inventory-toggle -- there's no keyboard-only path to any of
         these three, same as Inventory itself has none either. Wraps
         to a second centered line on a narrow phone rather than
         overflowing off-screen. */
      #quick-menu {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: min(70vw, 420px);
        z-index: 6;
      }
      #quick-menu button {
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.65);
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      #quick-menu button:active {
        background: rgba(216, 201, 163, 0.35);
      }
      #win-screen {
        position: fixed;
        inset: 0;
        /* display: none by default (matches the `hidden` attribute in the
           HTML) so the screen doesn't show until Hud.showWinScreen() runs.
           An ID selector beats the browser's own `[hidden]` rule on
           specificity, so that default has to be spelled out here rather
           than left to `hidden` alone -- shown again via the :not([hidden])
           rule below once JS clears the attribute. */
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        background: rgba(5, 4, 2, 0.9);
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        text-align: center;
        z-index: 10;
      }
      #win-screen:not([hidden]) {
        display: flex;
      }
      #win-screen-title {
        font-size: 30px;
        letter-spacing: 0.1em;
      }
      #win-screen-epilogue {
        font-size: 15px;
        line-height: 1.7;
        max-width: 480px;
        opacity: 0.85;
        white-space: pre-line;
      }
      #defeat-screen {
        position: fixed;
        inset: 0;
        display: none; /* see the #win-screen comment above for why this default has to be explicit */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        background: rgba(20, 3, 3, 0.88);
        color: #d8b3a3;
        text-shadow: 0 1px 3px #000;
        text-align: center;
        z-index: 10;
      }
      #defeat-screen:not([hidden]) {
        display: flex;
      }
      #defeat-screen-title {
        font-size: 30px;
        letter-spacing: 0.1em;
      }
      /* The fight's last several log lines (Game.checkCombatEnd,
         player report: "When the party dies I can't read the combat
         log to see what happened" -- CombatEngine.hide() used to yank
         the whole combat overlay, log included, the instant defeat
         was detected). Left-aligned, unlike #combat-log's centered
         short excerpt -- several lines read better ragged than
         centered -- and scrollable so a long fight never pushes the
         title off a short phone screen. */
      #defeat-screen-log {
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-line;
        text-align: left;
        max-width: 480px;
        max-height: 40vh;
        overflow-y: auto;
        width: 90%;
        background: rgba(5, 4, 2, 0.4);
        border-radius: 8px;
        padding: 12px 16px;
        opacity: 0.9;
      }

      /* Combat overlay: mounted by CombatUI.ts. Same "spell out display:none
         explicitly" pattern as #win-screen above, learned from that bug --
         an ID selector would otherwise beat the browser's own [hidden] rule
         and leave this visible from page load. The background dims the
         corridor and, deliberately, blocks taps to whatever is underneath
         (the touch move-pad included) so combat fully replaces exploration
         input rather than layering confusingly on top of it. */
      #combat-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: rgba(5, 4, 2, 0.35);
        pointer-events: auto;
        z-index: 8;
      }
      #combat-ui:not([hidden]) {
        display: flex;
      }
      /* The initiative tracker (docs/08-roadmap-phases.md Phase 6,
         added on a player request to "plan ahead"): one pill per
         combatant in CombatEngine.turnQueue, in the order they'll
         actually act this round. */
      #combat-initiative {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      .initiative-pill {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(216, 201, 163, 0.4);
        background: rgba(20, 17, 13, 0.65);
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        font-size: 12px;
        opacity: 0.6; /* the "upcoming" default -- current/acted below override it */
      }
      .initiative-pill.current {
        opacity: 1;
        border-color: #e8d9a8;
        background: rgba(216, 201, 163, 0.25);
      }
      .initiative-pill.acted {
        opacity: 0.35;
      }
      .initiative-pill.down {
        opacity: 0.35;
        border-color: rgba(139, 30, 30, 0.6);
        text-decoration: line-through;
      }
      .initiative-icon {
        font-size: 14px;
        line-height: 1;
      }
      #combat-status {
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        font-size: 18px;
      }
      #combat-log {
        color: #d8c9a3;
        text-shadow: 0 1px 3px #000;
        background: rgba(5, 4, 2, 0.55);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-line;
        max-width: 480px;
        width: 90%;
        text-align: center;
      }
      #combat-actions,
      #combat-skills,
      #combat-items {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      #combat-skills,
      #combat-items {
        margin-top: 8px;
      }
      #combat-actions[hidden],
      #combat-skills[hidden],
      #combat-items[hidden] {
        display: none;
      }
      .combat-item-btn,
      .combat-skill-btn {
        font-size: 13px;
        padding: 8px 14px;
      }
      .combat-action-btn {
        font-size: 16px;
        padding: 10px 22px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.75);
        color: #d8c9a3;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .combat-action-btn:active {
        background: rgba(216, 201, 163, 0.35);
      }
      .combat-action-btn:disabled {
        opacity: 0.4;
      }

      /* Inventory/equip overlay: mounted by InventoryUI.ts. Same
         explicit "display:none by default" pattern as #win-screen and
         #combat-ui above -- an ID selector would otherwise beat the
         browser's own [hidden] rule. Opened from exploration only (see
         Game.ts's toggleInventory), so unlike #combat-ui it never needs
         to coexist with the touch move/turn pads underneath. */
      #inventory-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        gap: 12px;
        background: rgba(5, 4, 2, 0.92);
        color: #d8c9a3;
        pointer-events: auto;
        overflow-y: auto;
        z-index: 12;
      }
      #inventory-ui:not([hidden]) {
        display: flex;
      }
      /* Shared by all four menu screens' headers (Inventory/Bestiary/
         Level Up/Options -- see MenuNav.ts's Phase 7 cross-navigation
         row, built identically by all of them via buildMenuNav). Each
         screen still keeps its own #foo-header id for its outer flex
         row, but the actions row and buttons inside it are visually
         identical everywhere, so those are classes, not per-screen ids
         -- the one deliberate exception to this project's usual
         per-screen-id CSS convention, since duplicating this block
         four times over would be pure noise. */
      #inventory-header,
      #bestiary-header,
      #options-header,
      #levelup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 20px;
        letter-spacing: 0.08em;
        border-bottom: 1px solid rgba(216, 201, 163, 0.3);
        padding-bottom: 10px;
      }
      .menu-nav-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .menu-nav-btn {
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.75);
        color: #d8c9a3;
        touch-action: none;
      }
      .menu-nav-btn:active {
        background: rgba(216, 201, 163, 0.35);
      }
      #inventory-body {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .inventory-heading {
        font-size: 13px;
        letter-spacing: 0.06em;
        opacity: 0.75;
        margin-bottom: 8px;
      }
      #inventory-carried {
        display: flex;
        flex-direction: column;
      }
      .inventory-empty {
        font-size: 13px;
        opacity: 0.6;
        font-style: italic;
      }
      .inventory-item-btn,
      .inventory-slot-btn,
      .inventory-use-btn {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 14px;
        padding: 9px 12px;
        margin-bottom: 6px;
        border-radius: 6px;
        border: 1px solid rgba(216, 201, 163, 0.3);
        background: rgba(20, 17, 13, 0.5);
        color: #d8c9a3;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .inventory-item-btn.not-equippable {
        opacity: 0.65;
      }
      .inventory-item-btn.selected {
        border-color: #d8c9a3;
        background: rgba(216, 201, 163, 0.25);
      }
      .inventory-slot-btn.match {
        border-color: rgba(140, 200, 140, 0.8);
      }
      /* Shown per character card only while a cure consumable is
         selected (InventoryUI.buildPartySection) -- a distinct green
         tint, same family as .inventory-slot-btn.match above, so it
         reads as "tap here to actually do the thing" rather than
         blending into the plain gear-slot rows underneath it. */
      .inventory-use-btn {
        border-color: rgba(140, 200, 140, 0.6);
        background: rgba(140, 200, 140, 0.15);
      }
      #inventory-party {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .inventory-character-name {
        font-size: 15px;
        margin-bottom: 6px;
      }

      /* Bestiary/codex overlay: mounted by BestiaryUI.ts. Same explicit
         "display:none by default" pattern as #inventory-ui above -- an
         ID selector would otherwise beat the browser's own [hidden]
         rule. Opened from the inventory screen, not its own always-
         visible button, so it shares that screen's "exploration is
         fully stopped" precondition rather than needing its own. */
      #bestiary-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        gap: 12px;
        background: rgba(5, 4, 2, 0.92);
        color: #d8c9a3;
        pointer-events: auto;
        overflow-y: auto;
        z-index: 13;
      }
      #bestiary-ui:not([hidden]) {
        display: flex;
      }
      #bestiary-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #bestiary-empty {
        font-size: 13px;
        opacity: 0.6;
        font-style: italic;
      }
      .bestiary-entry {
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.3);
        background: rgba(216, 201, 163, 0.06);
      }
      .bestiary-entry-name {
        font-size: 16px;
        margin-bottom: 6px;
      }
      .bestiary-entry-line {
        font-size: 13px;
        opacity: 0.85;
        line-height: 1.5;
      }

      /* Options overlay: mounted by OptionsUI.ts. Same explicit
         "display:none by default" pattern as #inventory-ui/#bestiary-ui
         above. Opened from the inventory screen, same reasoning as
         #bestiary-ui -- shares that screen's "exploration is fully
         stopped" precondition rather than needing its own. */
      #options-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        gap: 16px;
        background: rgba(5, 4, 2, 0.92);
        color: #d8c9a3;
        pointer-events: auto;
        overflow-y: auto;
        z-index: 13;
      }
      #options-ui:not([hidden]) {
        display: flex;
      }
      #options-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 360px;
      }
      .options-heading {
        font-size: 13px;
        letter-spacing: 0.06em;
        opacity: 0.75;
        margin-top: 12px;
        margin-bottom: 4px;
      }
      .options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        font-size: 14px;
      }
      .options-row select {
        font-size: 14px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(216, 201, 163, 0.4);
        background: rgba(20, 17, 13, 0.6);
        color: #d8c9a3;
        min-width: 72px;
      }
      .options-row input[type="range"] {
        flex: 1;
        max-width: 200px;
      }
      .options-row input[type="checkbox"] {
        width: 22px;
        height: 22px;
      }

      /* Level-up overlay: mounted by LevelUpUI.ts. Same family/pattern
         as #options-ui immediately above -- opened from the inventory
         screen, same "exploration already fully stopped" precondition. */
      #levelup-ui {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        gap: 16px;
        background: rgba(5, 4, 2, 0.92);
        color: #d8c9a3;
        pointer-events: auto;
        overflow-y: auto;
        z-index: 13;
      }
      #levelup-ui:not([hidden]) {
        display: flex;
      }
      #levelup-body {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 420px;
      }
      .levelup-character {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(216, 201, 163, 0.2);
      }
      .levelup-character-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .levelup-points {
        font-size: 12px;
        opacity: 0.8;
      }
      /* Class + current HP/Mana (LevelUpUI.buildMetaRow) -- sits right
         under the name/level header, above the Stats section whose
         Vitality/Focus rows are what actually move these two numbers. */
      .levelup-meta {
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 6px;
      }
      .levelup-heading {
        font-size: 12px;
        letter-spacing: 0.06em;
        opacity: 0.7;
        margin-top: 8px;
      }
      .levelup-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0;
        font-size: 13px;
      }
      .levelup-btn {
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.75);
        color: #d8c9a3;
        touch-action: none;
      }
      .levelup-btn:active {
        background: rgba(216, 201, 163, 0.35);
      }
      .levelup-btn:disabled {
        opacity: 0.4;
      }

      /* Party-creation screen: mounted by PartyCreationUI.ts, shown once
         before Game (and its WebGL context) even exists -- see main.ts.
         No [hidden]-vs-display gotcha to worry about here (unlike
         #win-screen etc.): this element is only ever created once the
         player still needs to see it, and removed outright on confirm,
         never toggled. */
      #party-creation {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 20px;
        padding-top: max(20px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        background: #0a0906;
        color: #d8c9a3;
        overflow-y: auto;
        z-index: 20;
      }
      #party-creation-title {
        font-size: 26px;
        letter-spacing: 0.1em;
        margin-top: 8px;
      }
      #party-creation-subtitle {
        font-size: 14px;
        opacity: 0.75;
        margin-bottom: 8px;
      }
      #party-creation-slots {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 420px;
      }
      .party-creation-slot {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.3);
        background: rgba(216, 201, 163, 0.06);
      }
      .party-creation-name {
        font-size: 15px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid rgba(216, 201, 163, 0.4);
        background: rgba(5, 4, 2, 0.6);
        color: #d8c9a3;
        font-family: inherit;
      }
      .party-creation-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .party-creation-choice-btn {
        font-size: 13px;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid rgba(216, 201, 163, 0.35);
        background: rgba(20, 17, 13, 0.6);
        color: #d8c9a3;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .party-creation-choice-btn.selected {
        border-color: #d8c9a3;
        background: rgba(216, 201, 163, 0.3);
      }
      .party-creation-portrait-btn {
        font-size: 16px;
        padding: 6px 10px;
      }
      /* Batch 9's attribute-point/starting-skill sections, appended
         after the name/class/portrait rows and rebuilt whenever the
         class selection changes (PartyCreationUI.onClassChanged) --
         same visual language as the rest of the screen (.party-creation-row/
         .party-creation-choice-btn are reused as-is for the skill
         picker), plus a couple of small new rules for the stat rows
         and headings, deliberately styled like LevelUpUI's own
         .levelup-heading/.levelup-row rather than inventing a third
         look for what's mechanically the same "+1 per point" idea. */
      .party-creation-section {
        width: 100%;
      }
      .party-creation-heading {
        font-size: 12px;
        letter-spacing: 0.06em;
        opacity: 0.7;
        margin-top: 10px;
      }
      .party-creation-stat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0;
        font-size: 13px;
      }
      .party-creation-derived-row {
        display: flex;
        gap: 16px;
        font-size: 13px;
        opacity: 0.85;
        padding: 2px 0 6px;
        border-bottom: 1px solid rgba(216, 201, 163, 0.15);
        margin-bottom: 2px;
      }
      .party-creation-skill-description {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 6px;
      }
      #party-creation-confirm {
        margin: 10px 0 24px;
        font-size: 16px;
        padding: 12px 32px;
        border-radius: 8px;
        border: 1px solid rgba(216, 201, 163, 0.5);
        background: rgba(20, 17, 13, 0.75);
        color: #d8c9a3;
        letter-spacing: 0.05em;
        touch-action: none;
      }
      #party-creation-confirm:active {
        background: rgba(216, 201, 163, 0.35);
      }
      #party-creation-confirm:disabled {
        opacity: 0.4;
        touch-action: none;
      }
      /* Shown only while attribute points remain unspent (PartyCreationUI.refreshConfirmButton)
         -- disabling the confirm button alone has no touch-friendly
         explanation (no hover tooltip on a phone), so this text is the
         actual reason, not just decoration. */
      #party-creation-confirm-hint {
        font-size: 12px;
        opacity: 0.75;
        color: #d8a24a;
        margin: -4px 0 6px;
        text-align: center;
      }
      #party-creation-continue {
        margin-top: 4px;
        font-size: 15px;
        padding: 10px 28px;
        border-radius: 8px;
        border: 1px solid rgba(140, 200, 140, 0.6);
        background: rgba(140, 200, 140, 0.18);
        color: #d8c9a3;
        letter-spacing: 0.05em;
        touch-action: none;
      }
      #party-creation-continue:active {
        background: rgba(140, 200, 140, 0.35);
      }
      #party-creation-new-game-label {
        font-size: 12px;
        opacity: 0.6;
        margin: 4px 0 2px;
      }
      #party-creation-hint {
        font-size: 12px;
        opacity: 0.6;
        margin: -4px 0 4px;
        text-align: center;
        max-width: 320px;
      }

      /* Touch controls: mounted by TouchControls.ts, hidden by default so
         mouse-driven desktops don't see buttons they don't need. Shown for
         any device whose primary pointer is coarse and has no hover (i.e.
         touch-primary), regardless of screen size. */
      #touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      @media (hover: none) and (pointer: coarse) {
        #touch-controls {
          display: block;
        }
        #hud .keyboard-hint {
          display: none;
        }
        #hud .touch-hint {
          display: block;
        }
      }
      .touch-pad {
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom));
        pointer-events: auto;
      }
      #move-pad {
        left: max(16px, env(safe-area-inset-left));
        width: 168px;
        height: 168px;
        display: grid;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(3, 54px);
        gap: 3px;
      }
      #turn-pad {
        right: max(16px, env(safe-area-inset-right));
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }
      .tp-btn {
        font-size: 22px;
        line-height: 1;
        color: #d8c9a3;
        background: rgba(20, 17, 13, 0.55);
        border: 1px solid rgba(216, 201, 163, 0.35);
        border-radius: 10px;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .tp-btn:active {
        background: rgba(216, 201, 163, 0.35);
      }
      .tp-up { grid-column: 2; grid-row: 1; }
      .tp-left { grid-column: 1; grid-row: 2; }
      .tp-right { grid-column: 3; grid-row: 2; }
      .tp-down { grid-column: 2; grid-row: 3; }
      .tp-interact { grid-column: 2; grid-row: 2; font-size: 12px; }
      #turn-pad .tp-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="combat-flash"></div>
    <button id="inventory-toggle" type="button">Inventory</button>
    <button id="mute-toggle" type="button" aria-label="Mute audio">🔊</button>
    <div id="quick-menu">
      <button id="bestiary-toggle" type="button">Bestiary</button>
      <button id="levelup-toggle" type="button">Level Up</button>
      <button id="options-toggle" type="button">Options</button>
    </div>
    <div id="hud-party"></div>
    <div id="hud">
      <div class="title">THE HOLLOW CROWN</div>
      <div id="hud-level"></div>
      <div class="keyboard-hint">W/S: walk &nbsp; A/D: strafe &nbsp; Q/E or ←/→: turn &nbsp; Space: interact</div>
      <div class="touch-hint">Left pad: move &amp; interact &nbsp; right pad: turn</div>
      <div id="hud-message"></div>
      <div id="hud-inventory"></div>
    </div>
    <div id="win-screen" hidden>
      <div id="win-screen-title">THE WARDS ARE QUIET</div>
      <div id="win-screen-epilogue"></div>
    </div>
    <div id="defeat-screen" hidden>
      <div id="defeat-screen-title">THE PARTY HAS FALLEN</div>
      <div id="defeat-screen-log"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
