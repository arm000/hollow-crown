monster-steward-marrow:
  id: monster-steward-marrow
  category: monster-sprite
  name: Steward Marrow (Act 1 boss)
  description: >-
    Physical-resistant, Holy-weak, combines the Rot-thing's telegraph and the Wraith's Fear —
    visually the largest/most detailed sprite in Act 1, a decayed ceremonial steward, per
    docs/02-setting-and-story.md.
  status: procedural
  size: 64×64 px/frame
  placeholderNotes: >-
    Game.ts's buildMonsterMesh: no MONSTER_COLORS entry, falls back to the same sickly-green default
    as the Rot-thing — currently visually indistinguishable from it, which real art needs to fix.
  links:
    - kind: monster
      id: stewardMarrow
